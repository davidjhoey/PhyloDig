schema_version: 1

context:
  version: "0.1.1"

package:
  name: phylodig
  version: ${{ version }}

source:
  url: https://github.com/davidjhoey/PhyloDig/archive/refs/tags/v0.1.1.tar.gz
  sha256: c16791ea997fc5642193ec31a62668b54674b65f14c6e62db7e9191d9a6d3b36

build:
  number: 0
  noarch: generic
  script:
    - mkdir -p $PREFIX/bin
    - cp phylodig.sh $PREFIX/bin/phylodig
    - chmod +x $PREFIX/bin/phylodig

requirements:
  run:
    - emboss
    - hmmer
    - seqkit

tests:
  - script:
      - phylodig --help